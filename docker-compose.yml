# Define the global project name
name: support-system-coding-test

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: support-system-app:latest
    container_name: support-system-app
    restart: unless-stopped
    tty: true
    volumes:
      - .:/var/www
    networks:
      - support-network

  # Nginx Web Server
  webserver:
    image: nginx:alpine
    container_name: support-system-webserver
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
      - ./docker-config/nginx:/etc/nginx/conf.d
    networks:
      - support-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: support-system-db
    restart: unless-stopped
    tty: true
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: support_system_db
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_USER: support_user
      MYSQL_PASSWORD: root
    volumes:
      - support_dbdata:/var/lib/mysql
    networks:
      - support-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: support-system-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    networks:
      - support-network

  # Queue worker (processes queued mail/jobs from the `jobs` table)
  queue:
    image: support-system-app:latest
    container_name: support-system-queue
    restart: unless-stopped
    tty: true
    volumes:
      - .:/var/www
    networks:
      - support-network
    depends_on:
      - app
      - db
    command: php artisan queue:work --sleep=3 --tries=3

networks:
  support-network:
    driver: bridge

volumes:
  support_dbdata:
    driver: local
